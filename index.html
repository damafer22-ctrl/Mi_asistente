<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi asistente</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #203047;
      text-align: center;
    }

    header {
      background: #245b78;
      color: white;
      padding: 28px 16px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      font-size: 19px;
      margin-bottom: 0;
    }

    main {
      max-width: 650px;
      margin: auto;
      padding: 24px 18px;
    }

    h2 { font-size: 25px; }

    .opcion {
      display: block;
      width: 100%;
      padding: 22px 16px;
      margin: 16px 0;
      border: 2px solid #245b78;
      border-radius: 14px;
      background: white;
      color: #203047;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .opcion:focus {
      outline: 4px solid #e0a526;
    }

    #resultado {
      margin-top: 24px;
      padding: 20px;
      background: white;
      border-radius: 14px;
      font-size: 20px;
      line-height: 1.5;
      text-align: left;
    }

    footer {
      padding: 20px;
      color: #526579;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mi asistente</h1>
    <p>La tecnología, más fácil para ti</p>
  </header>

  <main>
    <h2>¿En qué puedo ayudarte?</h2>

    <button class="opcion" onclick="mostrar('entender')">
      Entender un texto o mensaje
    </button>

    <button class="opcion" onclick="mostrar('movil')">
      Aprender a usar el móvil
    </button>

    <button class="opcion" onclick="mostrar('ayuda')">
      Resolver una duda
    </button>

    <section id="resultado" aria-live="polite">
      Elige una opción y te ayudaré paso a paso.
    </section>
  </main>

  <footer>
    Una ayuda sencilla, clara y cercana.
  </footer>

  <script>
    function mostrar(opcion) {
      const resultado = document.getElementById('resultado');

      if (opcion === 'entender') {
        resultado.textContent =
          'Aquí podrás aprender a entender textos y mensajes con palabras sencillas. Próximamente incorporaremos esta función.';
      } else if (opcion === 'movil') {
        resultado.textContent =
          'Aquí encontrarás explicaciones paso a paso para aprender a usar tu móvil. Próximamente incorporaremos esta función.';
      } else {
        resultado.textContent =
          'Aquí podrás consultar tus dudas y recibir ayuda clara y sencilla. Próximamente incorporaremos esta función.';
      }
    }
  </script>
</body>
</html>
